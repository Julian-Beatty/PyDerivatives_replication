[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyderivatives-replication"
version = "0.1.0"
description = "Replication for Asymmetric Relationships in Oil"
readme = { text = "PyDerivatives", content-type = "text/plain" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Julian Beatty" }]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=3.0,<3.1",
  "scipy>=1.14,<2",
  "matplotlib>=3.8,<4",
  "cvxpy>=1.6,<2",
  "ecos>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "networkx>=3.2,<4",
  "pycwt>=0.4,<1",
  "statsmodels>=0.14,<1",
  "pyarrow>=18,<22",
]
# ----------------------------------
# FIND ALL PACKAGES (incl. demodata)
# ----------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["pyderivatives*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
pyderivatives = ["demodata/*.csv", "demodata/*.pkl"]